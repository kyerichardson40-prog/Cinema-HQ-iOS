name: CinemaHQ
options:
  bundleIdPrefix: app.cinemahq
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: 'NO'
packages:
  SwiftTorrent:
    path: Vendor/SwiftTorrent
  VLCKit:
    url: https://github.com/videolan/vlckit.git
    revision: 2e0868f5ed40fe59cd92f377645fdcc260c6e759
targets:
  CinemaHQ:
    type: application
    platform: iOS
    sources: [CinemaHQ]
    info:
      path: CinemaHQ/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: SwiftTorrent
      - package: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cinemahq.ios
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        TARGETED_DEVICE_FAMILY: '1,2'
  CinemaHQTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CinemaHQ
      - package: SwiftTorrent
      - package: VLCKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'

