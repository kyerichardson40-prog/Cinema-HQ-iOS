# Decompile native AS3 layout and pause scripts.
name: Spider-Man native UI inspection
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/spiderman-native-ui-inspection.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: spiderman-patch-build
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input report
          gh api /repos/${{ github.repository }}/actions/artifacts/11815152546/zip > input/artifact.zip
          unzip -q input/artifact.zip -d input
      - run: python3 .github/scripts/inspect-native-ui.py input report
      - name: Inspect ActionScript 3 layout
        run: |
          curl -fsSL https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip -o ffdec.zip
          unzip -q ffdec.zip -d ffdec
          for movie in Gameplay TopBar Main; do
            java -Djava.awt.headless=true -jar ffdec/ffdec.jar -export script report/scripts/$movie report/$movie.swf
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Spider-Man-native-UI-inspection
          path: report/
          retention-days: 14
