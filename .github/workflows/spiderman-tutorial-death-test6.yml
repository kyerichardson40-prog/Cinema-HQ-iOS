name: Spider-Man Test6 tutorial death exit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/spiderman-tutorial-death-test6.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: spiderman-patch-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Test5 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input output report
          gh api /repos/${{ github.repository }}/actions/artifacts/11777055597/zip > input/artifact.zip
          unzip -q input/artifact.zip -d input
      - name: Install ARM64 execution verifier
        run: python3 -m pip install unicorn==2.1.4
      - name: Patch and verify tutorial and ordinary mission paths
        run: python3 .github/scripts/patch-tutorial-death-test6.py input/Spider-Man_Unlimited_v5.0.0_Test5_Safe_Fixes.ipa output/Spider-Man_Unlimited_v5.0.0_Test6_Tutorial_Death_Exit.ipa report
      - uses: actions/upload-artifact@v4
        with:
          name: Spider-Man-Test6-verification
          path: report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Spider-Man-Unlimited-Test6-Tutorial-Death-Exit-IPA
          path: output/*.ipa
          compression-level: 0
          retention-days: 14
