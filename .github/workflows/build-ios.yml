name: Build unsigned iOS IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'CinemaHQ/**'
      - 'project.yml'
      - '.github/workflows/build-ios.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare and test torrent engine
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/warppipe/swift-torrent.git Vendor/SwiftTorrent
          git -C Vendor/SwiftTorrent checkout --detach 79ab342c50621d69bce0d6f61228fcaf70c4ae48
          cp EngineTests/TorrentDownloadRegressionTests.swift Vendor/SwiftTorrent/Tests/SwiftTorrentTests/
          if swift test --package-path Vendor/SwiftTorrent --filter TorrentDownloadRegressionTests.testOutOfOrderBlocksRemainBuffered > /tmp/torrent-baseline.log 2>&1; then
            echo "Expected the original engine to fail the out-of-order regression"
            exit 1
          fi
          grep -q 'XCTAssertTrue failed' /tmp/torrent-baseline.log || { cat /tmp/torrent-baseline.log; exit 1; }
          python3 scripts/patch-torrent-engine.py
          swift test --package-path Vendor/SwiftTorrent --filter TorrentDownloadRegressionTests
      - name: Generate project
        run: xcodegen generate
      - name: Test torrent validation
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone")))')
          xcodebuild -project CinemaHQ.xcodeproj -scheme CinemaHQ -destination "platform=iOS Simulator,id=$device" -derivedDataPath TestDerivedData CODE_SIGNING_ALLOWED=NO test
      - name: Build
        run: xcodebuild -project CinemaHQ.xcodeproj -scheme CinemaHQ -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/CinemaHQ.app Payload/
          zip -qr CinemaHQ-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaHQ-unsigned-IPA
          path: CinemaHQ-unsigned.ipa
          retention-days: 7
