name: Download Spider-Man IPA
on:
  push:
    branches: [download-spiderman-ipa]
    paths: [.github/workflows/download-spiderman-ipa.yml]
permissions:
  contents: read
concurrency:
  group: download-spiderman-ipa
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtain fresh link and download IPA
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, http.cookiejar, shutil
          from html.parser import HTMLParser
          page = "https://www.mediafire.com/file/if9qq91yfrxgu4r/Spider-Man_Unlimited_v5.0.0.ipa/file"
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          class Parser(HTMLParser):
              url = None
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "a" and attrs.get("id") == "downloadButton":
                      self.url = attrs.get("href")
          with opener.open(page, timeout=60) as response:
              text = response.read().decode("utf-8", "replace")
          parser = Parser()
          parser.feed(text)
          if not parser.url:
              print(text[:4000])
              raise SystemExit("No download button found")
          target = urllib.parse.urlparse(parser.url)
          if target.scheme != "https" or not (target.hostname or "").endswith(".mediafire.com"):
              raise SystemExit("Unexpected download host")
          with opener.open(parser.url, timeout=120) as response, open("Spider-Man_Unlimited_v5.0.0.ipa", "wb") as output:
              shutil.copyfileobj(response, output)
          PY
      - name: Verify IPA archive
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, hashlib
          path = pathlib.Path("Spider-Man_Unlimited_v5.0.0.ipa")
          if not zipfile.is_zipfile(path):
              raise SystemExit("Downloaded response is not a ZIP/IPA archive")
          with zipfile.ZipFile(path) as archive:
              if not any(name.startswith("Payload/") and ".app/" in name for name in archive.namelist()):
                  raise SystemExit("Archive does not contain an iOS app Payload")
          print("Size:", path.stat().st_size)
          print("SHA256:", hashlib.file_digest(path.open("rb"), "sha256").hexdigest())
          PY
      - name: Split for artifact transfer
        run: split -b 350M -d Spider-Man_Unlimited_v5.0.0.ipa ipa-part-
      - uses: actions/upload-artifact@v4
        with:
          name: Spider-Man-IPA-part-00
          path: ipa-part-00
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: Spider-Man-IPA-part-01
          path: ipa-part-01
          compression-level: 0
          retention-days: 3
